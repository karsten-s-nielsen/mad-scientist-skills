; Anchors pytest's rootdir at the repo root. The root conftest.py is what puts each
; skill directory on sys.path, and pytest only loads conftest files from rootdir
; down — so with no config file at all, rootdir is inferred from the arguments and
; that discovery depends on how the suite happens to be invoked. This file makes it
; explicit instead: rootdir is wherever pytest.ini lives, regardless of invocation.
[pytest]
testpaths = tests
